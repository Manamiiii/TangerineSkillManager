name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run schema
      - run: git diff --exit-code -- config
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:source
      - run: npm run build
      - name: Desktop acceptance (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Desktop acceptance (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Package unsigned application
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: skill-manager-${{ runner.os }}-unsigned
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: error
