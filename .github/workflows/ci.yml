name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run schema
      - run: git diff --exit-code -- config
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:source
      - run: npm run build
      - name: Desktop acceptance (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Desktop acceptance (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Package unsigned application
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build isolated installer fixtures (Windows)
        if: runner.os == 'Windows'
        run: npm run build:installer-fixtures
      - name: Audit packaged application (Windows)
        if: runner.os == 'Windows'
        run: npm run audit:package
      - name: Packaged application acceptance (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop -- --packaged "${{ github.workspace }}/release/win-unpacked/Tangerine Skill Manager.exe"
      - name: Installed application lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npm run test:installer -- "release/installer-acceptance/current/TangerineSkillManager-$version-win-x64-Setup.exe" "release/installer-acceptance/previous/TangerineSkillManager-0.0.9-win-x64-Setup.exe"
      - run: npm run checksums
      # Build and test only. Do not upload installers, profiles or reports from this public repository.
